    <!DOCTYPE html>
    <html lang="en">

    <head>
        <link rel="stylesheet" href="styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <a href="index.html" class="logo"><img id="website-logo" src="images/logo.png">Matin Venepaja</a>
            <nav class="nav">
                <a href="index.html">Etusivu</a>
                <a href="boat1.html" class="offer-link">Erikoistarjous</a>
                <a href="contact.html">Ota yhteyttä</a>
            </nav>
        </header>

        
            <script>
                const logo = document.getElementById("website-logo");

                logo.addEventListener("mouseenter", function () {
                    logo.classList.add("moved");
                });
            </script>

        <main>

            <h1>Ota yhteyttä</h1>   

            <form action="https://httpbin.org/post" method="POST">

                <label for="name">Nimi:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Sähköposti:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Puhelinnumero:</label>
                <input type="tel" id="phone" name="phone">

                <label for="boat">Kiinnostava vene:</label>
                <select id="boat" name="boat" required>
                    <option value="">Valitse vene</option>
                    <option value="vene1">Terhi - 475 Twin C</option>
                    <option value="vene2">Buster Magnum CC</option>
                    <option value="vene3">The old tug</option>
                </select>

                <label for="message">Viesti:</label>
                <textarea id="message" name="message" required minlength="10"></textarea>

                <button type="submit">Lähetä</button>

            </form>
        </main>
        <footer>
            <p>&copy; 2026 Matin Venepaja</p>
        </footer>
        <script>
                    const params = new URLSearchParams(window.location.search);
                    const boat = params.get("boat");
                    const boatSelect = document.getElementById("boat");

                    if (boat && boatSelect.querySelector('option[value="' + boat + '"]')) {
                        boatSelect.value = boat;
                    }
        </script>
    </body>

    </html>
